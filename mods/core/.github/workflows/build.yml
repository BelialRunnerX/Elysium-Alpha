name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          path: elysium-core

      # The library this mod is built against.
      #
      # Built from source here rather than pulled from a package registry, so
      # that a change to the library which breaks core fails on the very next
      # push instead of at the next release. If you would rather pin a release,
      # add `ref: v1.0.0` below and the build becomes reproducible instead.
      - name: Checkout elysium-lib
        uses: actions/checkout@v4
        with:
          repository: BelialRunnerX/elysium-lib
          path: elysium-lib

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrappers executable
        run: chmod +x elysium-lib/gradlew elysium-core/gradlew

      # ~/.m2 is the handover. core's build.gradle lists mavenLocal() among its
      # repositories, so this is all the wiring the two projects need.
      - name: Build and install elysium-lib
        working-directory: elysium-lib
        run: |
          python3 validate.py
          ./gradlew publishToMavenLocal --stacktrace

      # Cheap, and it fails in seconds rather than after a 15-minute Gradle
      # run: every model resolves to a texture, every recipe and loot table to
      # a registered item, every item is obtainable in survival, and the race
      # and class balance invariants hold.
      - name: Validate resources
        working-directory: elysium-core
        run: python3 validate.py

      - name: Build with Gradle
        working-directory: elysium-core
        run: ./gradlew build --stacktrace

      # The finished mod jar. It needs the elysiumlib jar from the elysium-lib
      # repo's own build to run — install both.
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elysium-jar
          path: |
            elysium-core/build/libs/*.jar
            !elysium-core/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      # Uploaded alongside it so a run hands you a working pair rather than
      # half of one.
      - name: Upload the library jar it was built against
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elysiumlib-jar
          path: |
            elysium-lib/build/libs/*.jar
            !elysium-lib/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      # Kept separate so a failed build still hands you something to read.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            elysium-core/build/reports/
            elysium-lib/build/reports/
          if-no-files-found: ignore
          retention-days: 7
