plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.0'
}

version = '1.0.0'
group = 'com.elysium'

base {
    archivesName = 'elysium'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = "21.0.0-beta"

    runs {
        client {
            workingDirectory project.file('run')
            property 'neoforge.logging.markers', 'REGISTRIES'
            property 'neoforge.logging.console.level', 'debug'
            mods {
                elysium {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'neoforge.logging.markers', 'REGISTRIES'
            property 'neoforge.logging.console.level', 'debug'
            mods {
                elysium {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:21.0.0-beta"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "elysium",
            "Specification-Vendor": "Elysium",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": "Elysium"
        ])
    }
}