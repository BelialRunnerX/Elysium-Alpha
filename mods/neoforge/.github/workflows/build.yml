name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Cheap, and it fails in seconds rather than after a 15-minute Gradle
      # run: every model resolves to a texture, every recipe and loot table to
      # a registered item, every item is obtainable in survival, and the race
      # and class balance invariants hold.
      - name: Validate resources
        run: python3 validate.py

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      # The finished mod jar. Download it from the "Artifacts" section at the
      # bottom of this run's summary page.
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elysium-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      # Kept separate so a failed build still hands you something to read.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 7
